<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>27 - Paginacao</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
        #paginacao { margin-top: 12px; display: flex; gap: 6px; }
        #paginacao button { padding: 6px 12px; cursor: pointer; }
        #paginacao button.atual { background: #333; color: #fff; }
        #paginacao button:disabled { opacity: 0.5; cursor: not-allowed; }
        #info { margin: 8px 0; }
        li { padding: 4px 0; }
    </style>
</head>
<body>
    <h1>Paginacao</h1>

    <label>Itens por pagina:
        <select id="por-pagina">
            <option value="5" selected>5</option>
            <option value="10">10</option>
            <option value="15">15</option>
        </select>
    </label>

    <p id="info"></p>
    <ul id="lista"></ul>
    <div id="paginacao"></div>

    <script src="27_paginacao.js" defer></script>
</body>
</html>
