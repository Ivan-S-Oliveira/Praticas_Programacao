<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>30 - Todo List</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
        form { display: flex; gap: 6px; }
        #input-tarefa { flex: 1; padding: 8px; }
        form button { padding: 8px 16px; }
        #contador { color: #666; margin: 10px 0; }
        .filtros { display: flex; gap: 6px; margin-bottom: 10px; }
        .filtros button { padding: 6px 12px; cursor: pointer; }
        .filtros button.ativo { background: #333; color: #fff; }
        ul { list-style: none; padding: 0; }
        li {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px; border-bottom: 1px solid #eee;
        }
        li span { flex: 1; }
        li.concluida span { text-decoration: line-through; color: #999; }
        li.vazio { color: #888; font-style: italic; justify-content: center; }
        li button { padding: 4px 10px; }
    </style>
</head>
<body>
    <h1>Todo List</h1>

    <form id="form-tarefa">
        <input id="input-tarefa" placeholder="Nova tarefa" autocomplete="off">
        <button type="submit">Adicionar</button>
    </form>

    <p id="contador"></p>

    <div class="filtros">
        <button data-filtro="todas" class="ativo">Todas</button>
        <button data-filtro="ativas">Ativas</button>
        <button data-filtro="concluidas">Concluidas</button>
        <button id="limpar-concluidas">Limpar concluidas</button>
    </div>

    <ul id="lista"></ul>

    <script src="30_todo_list.js" defer></script>
</body>
</html>
